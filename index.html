<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeoBack Air Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a centred book on a desk surface — two-page spread on wide screens, single page on phones; toolbar above */
:root{
  --desk:#e9e5df; --desk-ink:#3b3631; --desk-quiet:#7a726a; --chip:#ffffff; --chip-line:#d6d0c8;
  --paper:#ffffff; --ink:#1d1d1f; --quiet:#5a5a60; --red:#c8302c; --line:#e3e3e6; --tint:#f6f3f2;
  --sans:"Poppins","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#1f1d1b;--desk-ink:#ece7e1;--desk-quiet:#a59d94;--chip:#2c2926;--chip-line:#45403b;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#1f1d1b;--desk-ink:#ece7e1;--desk-quiet:#a59d94;--chip:#2c2926;--chip-line:#45403b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--desk-ink);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
.bar{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.bar h1 span{color:var(--desk-quiet);font-weight:400;margin-left:6px}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--desk-ink);font:500 13px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;perspective:2600px}
.book{position:relative;display:flex;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18))}
.slot{width:var(--pw);height:var(--ph);position:relative}
.book.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:40px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,0) 0,rgba(0,0,0,.10) 48%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.10) 52%,rgba(0,0,0,0) 100%);pointer-events:none;z-index:5}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.45,.05,.35,1),opacity .7s;z-index:10}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
.nav{display:flex;align-items:center;gap:12px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--chip-line);background:var(--chip);color:var(--desk-ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.count{font:500 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--desk-quiet);min-width:72px;text-align:center}
.hint{font-size:12px;color:var(--desk-quiet)}

/* ---------- paper pages (deliberately always white, like printed stock) ---------- */
.page{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden;font-size:calc(var(--pw) * .0262);line-height:1.5;padding:2.6em 2.4em 2.4em;display:flex;flex-direction:column}
.page.zh{font-family:var(--zh);line-height:1.7}
.page.dense{font-size:calc(var(--pw) * .0236)}
.page.denser{font-size:calc(var(--pw) * .0222)}
.page.blank{background:var(--paper)}
.left .page,.leaf .back .page{box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.18)}
.right .page,.leaf .front .page{box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.18)}
.single .page{box-shadow:none}
.ph{display:flex;align-items:center;gap:.8em;margin-bottom:1.6em}
.ph .rule{flex:1;height:max(2px,.16em);background:var(--red);border-radius:2px}
.ph.l{flex-direction:row-reverse}
.logo{font-family:"Poppins",sans-serif;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.logo b{display:inline-block;color:#fff;background:var(--red);border-radius:.18em;padding:0 .12em;margin-left:.05em;line-height:1.05;font-weight:700}
.ph .logo{font-size:1.15em}
.pn{margin-top:auto;padding-top:.8em;text-align:center;font-size:.85em;color:var(--quiet);font-variant-numeric:tabular-nums}
h2.t{font-family:"Poppins",var(--zh);font-size:1.55em;font-weight:700;text-align:center;margin:0 0 .9em;letter-spacing:.005em}
h3.s{font-size:1.02em;font-weight:700;margin:.9em 0 .3em}
p{margin:0 0 .6em}
.c{text-align:center}
.small{font-size:.9em}
.k{font-weight:600}
.tag{display:inline-block;font-weight:700;margin:.4em 0 .25em}
ol,ul{margin:0 0 .6em;padding-left:1.3em}
li{margin-bottom:.35em}
.gear{margin:0 0 .55em .2em}
.gear .g{font-weight:600}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;border:.16em solid currentColor;vertical-align:-.08em;margin-right:.3em}
.app-s{color:var(--quiet)}
table.tb{width:100%;border-collapse:collapse;font-size:.92em}
table.tb td,table.tb th{border:1px solid #2a2a2a;padding:.45em .6em;vertical-align:middle;text-align:left}
table.tb th{font-weight:600;text-align:center}
table.spec td:first-child{width:40%;font-weight:500}
.note{font-size:.88em;color:var(--quiet);margin-top:.5em}
.fig{display:flex;justify-content:center;margin:.4em 0 .9em}
.fig svg{width:100%;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}
.step{display:grid;grid-template-columns:44% 1fr;gap:1em;align-items:center;margin-bottom:.8em}
.step .box{border:1.4px solid #2a2a2a;border-radius:.8em;padding:.4em}
.step .box svg{width:100%;height:auto;display:block}
.pill{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;border:1.3px solid currentColor;font-size:.8em;font-weight:600;vertical-align:.05em;margin:0 .15em}
/* cover */
.cover{padding:3.2em 2.6em;align-items:center;text-align:center;justify-content:space-between}
.cover .logo{font-size:2.3em}
.cover .ttl{font-size:2.05em;font-weight:500;line-height:1.25}
.cover .lang{font-size:1.25em;font-weight:500;margin-top:.6em;letter-spacing:.04em}
.cover .mail{font-weight:600;font-size:1.05em}
.toc{list-style:none;padding:0;margin:0;border-top:1.4px solid #2a2a2a;padding-top:1em}
.toc li{display:flex;align-items:baseline;gap:.5em;margin-bottom:.55em;cursor:pointer}
.toc li:hover .tl{color:var(--red)}
.toc .lead{flex:1;border-bottom:1.4px dashed #555;transform:translateY(-.25em)}
.toc .pg{font-variant-numeric:tabular-nums}
.qr{width:6em;height:6em;margin:.6em auto}
.social{display:flex;justify-content:center;gap:.7em;margin:.4em 0}
.social span{width:1.5em;height:1.5em;border-radius:.35em;display:grid;place-items:center;color:#fff;font-size:.72em;font-weight:700}
.handle{font-size:1.8em;font-weight:800;text-align:center;letter-spacing:.01em}
.redcard{background:linear-gradient(160deg,#d8322c,#b81f1c);color:#fff;border-radius:1em;padding:1em 1em .8em;margin:.6em 0 .9em}
.redcard .rt{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);border-radius:2em;text-align:center;font-weight:700;padding:.25em .5em;font-size:1.1em}
.redcard .rs{text-align:center;font-size:.82em;margin:.45em 0 .6em}
.redcard svg{width:100%;height:auto;display:block}
.back-cover{align-items:center;justify-content:center;text-align:center;gap:1em;background:#fbfafa}
</style>
</head>

const qr = (()=>{let s='<svg class="qr" viewBox="0 0 21 21" aria-hidden="true"><rect width="21" height="21" fill="#fff"/>';const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;s+=f(0,0)+f(14,0)+f(0,14);let seed=7;for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;seed=(seed*73+11)%101;if(seed%3===0)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;}return s+'</svg>';})();

// 3 PBM (p2)
add(`<div class="page dense">${head('l')}<h2 class="t">Photobiomodulation</h2>
<p>Photobiomodulation (PBM), originally known as low-level laser therapy (LLLT), was discovered in 1967 by Endre Mester, who noticed improved hair growth and wound healing in rats with a low-power ruby laser, unlike the high-power lasers used for tumor treatments.<br>Over time, it was found that not only lasers but also non-coherent light-emitting diodes (LEDs) could achieve similar therapeutic effects, leading to the adoption of the term (PBM).<br>This field has gained recognition for its potential in enhancing wound healing and cellular growth, and continues to evolve with ongoing research into its mechanisms and optimal application parameters.</p>
<div class="redcard"><div class="rt">Photobiomodulation</div><div class="rs">After exposure to red light, cells are activated, stimulating mitochondria to produce energy.</div>${pbm(['Irradiate body tissues','Improves tissue function','Anti-inflammatory effects, improves energy metabolism','Cytochrome c oxidase'])}</div>
<p>This innovative technique harnesses the power of light to instigate a cascade of beneficial changes at the cellular level. Central to its mechanism is the stimulation of mitochondria, the cell's powerhouse, enhancing the production of Adenosine Triphosphate (ATP), the vital energy currency of cellular functions. Beyond boosting energy availability, PBM facilitates improved cell signaling, fosters the synthesis of growth factors, and importantly, mitigates oxidative stress, thereby promoting cellular health and recovery.</p>${pn(2)}</div>`,
`<div class="page zh dense">${head('l')}<h2 class="t">光生物调节</h2>
<p>光生物调节（PBM），最初被称为低强度激光疗法（LLLT），由 Endre Mester 于 1967 年发现。他注意到，与用于肿瘤治疗的高功率激光不同，低功率红宝石激光可以促进大鼠的毛发生长和伤口愈合。<br>随着时间推移，人们发现不仅激光，非相干的发光二极管（LED）也能达到类似的治疗效果，因此开始采用"光生物调节（PBM）"这一术语。<br>该领域因其在促进伤口愈合和细胞生长方面的潜力而获得认可，相关机制和最佳应用参数的研究仍在不断发展。</p>
<div class="redcard"><div class="rt">光生物调节</div><div class="rs">红光照射后，细胞被激活，刺激线粒体产生能量。</div>${pbm(['照射身体组织','改善组织功能','抗炎作用，改善能量代谢','细胞色素 c 氧化酶'])}</div>
<p>这项创新技术利用光的力量，在细胞层面引发一系列有益的变化。其核心机制是刺激细胞的"能量工厂"——线粒体，促进三磷酸腺苷（ATP）的生成，而 ATP 是细胞功能所需的关键能量来源。除了提升能量供应外，PBM 还能改善细胞信号传导，促进生长因子的合成，更重要的是能够减轻氧化应激，从而促进细胞健康与恢复。</p>${pn(2)}</div>`);

<p class="c"><span class="k">Red light</span><br>The wavelength of red light is between 600-780 nanometers, and it can be absorbed by the skin up to a maximum depth of 4 to 5 millimeters, thereby enhancing the health and healing of the skin layer.</p>
<p class="c"><span class="k">NIR (Near-infrared)</span><br>The wavelength of NIR is between 780-1100 nanometers, which is invisible to the human eye. It can penetrate deeper into tissues up to 5-10 millimeters, and this absorption depth extends to bones, muscles, blood vessels, organs, abdominal fat, lymph nodes, and other tissues and fluids beneath the skin, thereby enhancing recovery and supporting anti-inflammatory processes.</p>${pn(3)}</div>`,

<h2 class="t" style="margin:.6em 0 .5em">Mode Introduction</h2>
<p>NeoBack Air offers four physiotherapy modes designed to meet your different lumbar care needs and comprehensively protect lumbar spine health.</p>

/* ---------- book engine ---------- */
const N = P.length;
const book = document.getElementById('book'), stage = document.getElementById('stage');
let lang = 'en', spreadMode = true, s = 0, idx = 0, busy = false;
try { const v = localStorage.getItem('nb-lang'); if (v === 'zh' || v === 'en') lang = v; } catch(e) {}
const face = i => (i < 0 || i >= N) ? '<div class="page blank"></div>' : P[i][lang];
const lastS = () => Math.ceil(N / 2);

function size(){
  const W = stage.clientWidth, H = stage.clientHeight;
  spreadMode = window.innerWidth >= 760;
  let pw = spreadMode ? Math.min((W - 8) / 2, H * 0.707) : Math.min(W, H * 0.707);
  pw = Math.max(240, Math.floor(pw)); const ph = Math.floor(pw / 0.707);
  document.documentElement.style.setProperty('--pw', pw + 'px');
  document.documentElement.style.setProperty('--ph', ph + 'px');
}
function render(){
  book.className = 'book ' + (spreadMode ? 'spread' : 'single');
  if (spreadMode){
    const L = 2*s - 1, R = 2*s;
    book.innerHTML = `<div class="slot left">${L>=0?face(L):''}</div><div class="slot right">${R<N?face(R):''}</div>`;
    if (L < 0) book.firstChild.style.visibility = 'hidden';
    if (R >= N) book.lastChild.style.visibility = 'hidden';
  } else {
    book.innerHTML = `<div class="slot">${face(idx)}</div>`;
  }
  fit(); wire(); status();
}
function fit(root){
  (root||book).querySelectorAll('.page').forEach(el=>{
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let f=base, n=0;
    while(el.scrollHeight>el.clientHeight+1 && n<40){ f*=0.97; el.style.fontSize=f+'px'; n++; }
  });
}
function wire(){
  book.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); go(+el.dataset.go); }));
}
function status(){
  const cur = spreadMode ? Math.max(0, 2*s-1) : idx;
  const lbl = spreadMode ? (s===0 ? '1' : (2*s<N ? `${2*s}–${2*s+1}` : `${2*s}`)) : `${idx+1}`;
  document.getElementById('count').textContent = `${lbl} / ${N}`;
  document.getElementById('prev').disabled = spreadMode ? s===0 : idx===0;
  document.getElementById('next').disabled = spreadMode ? s>=lastS() || 2*s>=N-1 : idx>=N-1;
  document.getElementById('b-en').setAttribute('aria-pressed', lang==='en');
  document.getElementById('b-zh').setAttribute('aria-pressed', lang==='zh');
  document.getElementById('sub').textContent = lang==='en' ? 'User Manual · electronic edition' : '用户手册 · 电子版';
  document.getElementById('hint').textContent = lang==='en' ? 'Click the page edges, use ← → keys, or swipe to turn pages' : '点击页面两侧、按 ← → 键或左右滑动即可翻页';
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN';
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flip(dir){
  if (busy) return;
  if (spreadMode){
    if (dir>0 && (2*s>=N-1)) return; if (dir<0 && s===0) return;
    if (reduce){ s += dir; render(); return; }
    busy = true;
    const leaf = document.createElement('div'); leaf.className = 'leaf';
    const left = book.querySelector('.left'), right = book.querySelector('.right');
    if (dir>0){
      leaf.style.left = '50%'; leaf.style.transformOrigin = 'left center';
      leaf.innerHTML = `<div class="face front">${face(2*s)}</div><div class="face back">${face(2*s+1)}</div>`;
      right.innerHTML = 2*s+2<N ? face(2*s+2) : ''; right.style.visibility = 2*s+2<N ? 'visible' : 'hidden';
    } else {
      leaf.style.left = '0'; leaf.style.transformOrigin = 'right center';
      leaf.innerHTML = `<div class="face front">${face(2*s-1)}</div><div class="face back">${face(2*s-2)}</div>`;
      left.innerHTML = 2*s-3>=0 ? face(2*s-3) : ''; left.style.visibility = 2*s-3>=0 ? 'visible' : 'hidden';
    }
    book.appendChild(leaf); fit();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ leaf.style.transform = `rotateY(${dir>0?-180:180}deg)`; }));
    const done = () => { s += dir; busy = false; render(); };
    leaf.addEventListener('transitionend', e => { if (e.propertyName==='transform') done(); }, {once:false});
    setTimeout(()=>{ if (busy) done(); }, 1000);
  } else {
    if (dir>0 && idx>=N-1) return; if (dir<0 && idx===0) return;
    if (reduce){ idx += dir; render(); return; }
    busy = true;
    const slot = book.querySelector('.slot');
    const leaf = document.createElement('div'); leaf.className = 'leaf'; leaf.style.left = '0';
    if (dir>0){ leaf.style.transformOrigin='left center'; leaf.innerHTML=`<div class="face front">${face(idx)}</div>`; slot.innerHTML = face(idx+1); }
    else { leaf.style.transformOrigin='left center'; leaf.style.transform='rotateY(-100deg)'; leaf.style.opacity='0'; leaf.innerHTML=`<div class="face front">${face(idx-1)}</div>`; }
    book.appendChild(leaf); fit();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(dir>0){leaf.style.transform='rotateY(-100deg)'; leaf.style.opacity='0';} else {leaf.style.transform='rotateY(0deg)'; leaf.style.opacity='1';} }));
    const done = () => { idx += dir; busy = false; render(); };
    setTimeout(done, 720);
  }
}
function go(i){
  i = Math.max(0, Math.min(N-1, i));
  if (spreadMode) s = Math.floor((i+1)/2); else idx = i;
  render();
}
document.getElementById('next').onclick = () => flip(1);
document.getElementById('prev').onclick = () => flip(-1);
book.addEventListener('click', e => {
  const r = book.getBoundingClientRect(); const x = e.clientX - r.left;
  if (spreadMode){ if (x > r.width*0.75) flip(1); else if (x < r.width*0.25) flip(-1); }
  else { if (x > r.width*0.6) flip(1); else if (x < r.width*0.4) flip(-1); }
});
addEventListener('keydown', e => { if (e.key==='ArrowRight') flip(1); if (e.key==='ArrowLeft') flip(-1); });
let tx=null; stage.addEventListener('touchstart', e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend', e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>40) flip(d<0?1:-1); tx=null; });
const setLang = l => { lang = l; try{localStorage.setItem('nb-lang', l)}catch(e){} render(); };
document.getElementById('b-en').onclick = () => setLang('en');
document.getElementById('b-zh').onclick = () => setLang('zh');
let wasSpread = null;
addEventListener('resize', () => { const cur = spreadMode ? Math.max(0,2*s-1) : idx; size(); if (wasSpread !== spreadMode){ if (spreadMode) s = Math.floor((cur+1)/2); else idx = cur; } wasSpread = spreadMode; render(); });
size(); wasSpread = spreadMode; render();
})();
</script>
</body>
